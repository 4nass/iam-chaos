name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  tests:
    name: Full test suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run pytest
        run: python -m pytest -q

  package:
    name: Installed package smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install IAMChaos
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv iam-chaos-venv
          iam-chaos-venv/bin/python -m pip install "$GITHUB_WORKSPACE"
          iam-chaos-venv/bin/python -m pip check
      - name: Import the installed Python library
        working-directory: ${{ runner.temp }}
        run: iam-chaos-venv/bin/python -I -c 'import iam_chaos'
      - name: Run the installed CLI
        working-directory: ${{ runner.temp }}
        run: |
          iam-chaos-venv/bin/iam-chaos run \
            "$GITHUB_WORKSPACE/examples/scenarios/iam-lifecycle-edge-cases.yaml" \
            --output-dir iam-chaos-results --allow-failures
          test -s iam-chaos-results/events.json
          test -s iam-chaos-results/payloads.json
          test -s iam-chaos-results/report.json
